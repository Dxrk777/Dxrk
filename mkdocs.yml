site_name: Dxrk
site_description: Dxrk Ecosystem Configurator — supercharge AI coding agents
site_url: https://dxrk777.github.io/Dxrk/
repo_url: https://github.com/Dxrk777/Dxrk
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: purple
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.integrate

nav:
  - Inicio: index.md
  - Uso: usage.md
  - Uso previsto: intended-usage.md
  - Agentes: agents.md
  - Componentes: components.md
  - Arquitectura: architecture.md
  - DxrkMemory 2.0: memory.md
  - ADR-002 Separación Memoria: adr/ADR-002-memory-separation.md
  - Migración 3.3.5 → 3.7.1: MIGRATION_3.3.5_3.7.1.md
  - Plataformas: platforms.md
  - Roadmap: roadmap.md
  - API Reference: api.md

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - codehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite

plugins:
  - search
  - social
  - mkdocstrings:
      default:
        show_source: true
