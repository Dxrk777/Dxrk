name: Bug report
description: Report a bug or unexpected behavior in Dxrk
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Please search existing issues first to avoid duplicates.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Dxrk is affected?
      options:
        - CLI (dxrk-py)
        - TUI
        - Agents / adapters
        - Configuration
        - Installer
        - Memory / RAG
        - MCP
        - Autonomy
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `dxrk-py --version`
      placeholder: "4.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Run `dxrk-py ...`
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / tracebacks
      description: Paste any relevant logs, error messages or tracebacks.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I can reproduce the issue on the latest version
