name: Feature request
description: Suggest a new feature or improvement for Dxrk
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please search existing issues and discussions first.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Dxrk would this affect?
      options:
        - CLI (dxrk-py)
        - TUI
        - Agents / adapters
        - Configuration
        - Installer
        - Memory / RAG
        - MCP
        - Autonomy
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What is missing today?
      placeholder: Describe the pain point or gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the feature work? Include usage examples if possible.
      placeholder: |
        ```
        dxrk-py <new-command> ...
        ```
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternatives did you consider?
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues and discussions for duplicates
          required: true
