name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      # Nota: sin publicación a PyPI. La distribución es vía git
      # (uv tool install git+https://github.com/Dxrk777/Dxrk.git) y
      # GitHub Releases. Si se quiere PyPI en el futuro, re-agregar un
      # job con Trusted Publishing (OIDC) + environment `pypi`.
      - name: Build package (smoke)
        run: uv build

      # Prepend-only: never regenerate the whole file (hand-maintained
      # history predates full conventional-commit coverage and a full
      # regen truncates it — see v1.4.0 restore commit).
      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          args: --unreleased --tag ${{ github.ref_name }} --prepend CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "Dxrk System"
          git config user.email "dxrk@local"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ github.ref_name }}"
          git push origin HEAD:main

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: false
          body_path: CHANGELOG.md
