name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: uv audit

      - name: Lint (ruff)
        run: uvx ruff check dxrk tests

      - name: Type check (mypy)
        run: uv run mypy dxrk

      - name: Test (pytest + coverage)
        shell: bash
        run: uv run pytest -q --cov-report=xml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  benchmark:
    name: Benchmarks (non-blocking)
    runs-on: ubuntu-latest
    # Job no bloqueante: no rompe el gate de CI ni la cobertura 75%
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Bench memory --quick (stdlib-only)
        continue-on-error: true
        run: uv run python benchmarks/bench_memory.py --quick --results-dir ""

      - name: Bench http --quick (stdlib-only)
        continue-on-error: true
        run: uv run python benchmarks/bench_http.py --quick --results-dir ""

      - name: Pytest benchmarks smoke (--benchmark-disable fallback)
        continue-on-error: true
        shell: bash
        run: |
          uv run python -m pytest benchmarks/ -q --benchmark-disable 2>&1 || uv run python -m pytest benchmarks/ -q

