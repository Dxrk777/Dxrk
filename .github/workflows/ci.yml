name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: uv audit

      - name: Lint (ruff)
        run: uvx ruff check dxrk tests

      - name: Type check (mypy)
        run: uv run mypy dxrk

      - name: Test (pytest + coverage)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Sin gate de cobertura en Windows: los tests POSIX-only se
            # skipean por diseno y el 80% es inalcanzable ahi. El gate
            # aplica en ubuntu/macos (ver AGENTS.md).
            uv run pytest -q -o addopts=""
          else
            uv run pytest -q --cov-report=xml
          fi

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml

  benchmark:
    name: Benchmarks (non-blocking)
    runs-on: ubuntu-latest
    # Job no bloqueante: no rompe el gate de CI ni la cobertura 75%
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Bench memory --quick (stdlib-only)
        continue-on-error: true
        run: uv run python benchmarks/bench_memory.py --quick --results-dir ""

      - name: Bench http --quick (stdlib-only)
        continue-on-error: true
        run: uv run python benchmarks/bench_http.py --quick --results-dir ""

      - name: Pytest benchmarks smoke (--benchmark-disable fallback)
        continue-on-error: true
        shell: bash
        run: |
          uv run python -m pytest benchmarks/ -q --benchmark-disable 2>&1 || uv run python -m pytest benchmarks/ -q

