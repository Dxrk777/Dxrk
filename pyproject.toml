[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dxrk"
version = "0.1.2"
description = "Dxrk Ecosystem Configurator — supercharge AI coding agents"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Dxrk777" }]
license = "MIT"
keywords = ["ai", "agents", "cli", "tui", "claude-code", "opencode", "mcp", "rag", "sdd", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]

dependencies = [
    "textual>=1.0,<9.0",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0",
    "cryptography>=43.0,<51.0",
    "beautifulsoup4>=4.12,<5",
]

[project.urls]
Homepage = "https://github.com/Dxrk777/Dxrk"
Repository = "https://github.com/Dxrk777/Dxrk"
Documentation = "https://github.com/Dxrk777/Dxrk/tree/main/docs"
Changelog = "https://github.com/Dxrk777/Dxrk/blob/main/CHANGELOG.md"
Issues = "https://github.com/Dxrk777/Dxrk/issues"

[project.scripts]
dxrk-py = "dxrk.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.24"]
typecheck = ["mypy>=1.10", "pytest>=8.0"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = ["tests/"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E741", "E402", "E731"]
per-file-ignores = { "**/__init__.py" = ["F401", "UP035"], "tests/test_model.py" = ["E721"] }

[tool.setuptools.packages.find]
include = ["dxrk*"]

[tool.setuptools.package-data]
dxrk = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "antigravity: Antigravity adapter tests",
  "claude: Claude adapter tests",
  "codex: Codex adapter tests",
  "cursor: Cursor adapter tests",
  "gemini: Gemini CLI adapter tests",
  "kilocode: KiloCode adapter tests",
  "kimi: Kimi adapter tests",
  "kiro: Kiro IDE adapter tests",
  "openclaw: OpenClaw adapter tests",
  "opencode: OpenCode adapter tests",
  "pi: Pi adapter tests",
  "qwen: Qwen adapter tests",
  "vscode: VS Code adapter tests",
  "windsurf: Windsurf adapter tests",
]
